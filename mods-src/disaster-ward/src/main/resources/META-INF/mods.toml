modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Оберег от катаклизмов (Disaster Ward)"
authors = "Minecraft_moded"
description = '''
Блок-оберег (только креатив): в его зоне (один радиус) не бушуют катаклизмы Weather2 и Natural Disasters!, не распространяется заражение Fungal Infection: Spore
и SRP System, пришедшие снаружи бедствия не ломают блоки внутри, ориджиниумная буря Bob's Originium Dream не призывает в зоне монстров и не растит шипы.
Редкий случайный спавн бедствий Natural Disasters! и ориджиниумной бури, отключение дублей.
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"
