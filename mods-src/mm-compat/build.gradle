plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.77'
}

group = 'dev.mcmoded'
version = mod_version
base { archivesName = 'mm-compat' }


legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Ad Astra — только API событий кислорода; Northstar и Creating Space читаются через теги и NBT
    modCompileOnly "maven.modrinth:ad-astra:${ad_astra_version}"
    // Superb Warfare — трассировка снарядов по кораблям VS (миксин SbwShipHitMixin); Kotlin — ради kotlin.Pair
    modCompileOnly "maven.modrinth:superb-warfare:${superb_warfare_version}"
    // Falling Tree (RakSrinaNa, LGPL-3.0) — миксин FallingTreeDamageMixin, необязательный
    modCompileOnly "maven.modrinth:fallingtree:${fallingtree_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:1.9.23"
    // Lycanites Mobs — только FearVisualHandler (его имена свои, не маппинги MC — remap не нужен)
    compileOnly "maven.modrinth:lycanites-mobs:${lycanites_version}"
    // JEI — плагин категории Imbuement Altar (JEI в рантайме необязателен: класс плагина грузит только сам JEI)
    modCompileOnly "maven.modrinth:jei:${jei_version}"
    // Electroblob's Wizardry Redux — тип рецепта и класс ImbuementAltarRecipe
    modCompileOnly "maven.modrinth:electroblobs-wizardry-redux:${redux_version}"
    // The Lost Cities (McJty, MIT) — миксин LostCitiesNeighborMixin (утечка BuildingInfo)
    modCompileOnly "maven.modrinth:the-lost-cities:${lostcities_version}"
    // Mekanism — capability радиационной защиты для костюма Create Nuclear (RadiationSuitShielding)
    modCompileOnly "maven.modrinth:mekanism:${mekanism_version}"
}

processResources {
    def props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

jar { manifest.attributes('MixinConfigs': 'mm_compat.mixins.json') }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
