plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.77'
}

group = 'dev.mcmoded'
version = mod_version
base { archivesName = 'necromancers-delight' }


legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories {
    flatDir { dirs '../fishs-undead-rising/build/libs' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Electroblob's Wizardry Redux — в продакшен-jar SRG-имена, ModDevGradle переводит их в наши маппинги
    modCompileOnly "maven.modrinth:electroblobs-wizardry-redux:${redux_version}"
    // Наш порт Fish's Undead Rising (mod_lavacow) — собирается рядом: cd ../fishs-undead-rising && ./gradlew build
    modCompileOnly "local:fishs-undead-rising-port:${fur_version}"
    // Curios — Leech Crystal Amulet наследует CuriosArtifactItem Redux (нужен для привязки стихии в Arcane Workbench)
    modCompileOnly "maven.modrinth:curios:${curios_version}"
}

processResources {
    def props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
