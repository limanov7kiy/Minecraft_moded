desc = "Огнестрельное и тяжёлое оружие, пушки, патроны, зачарования для оружия."

[categories.space]
title = "Космос и ракеты"
desc = "Ракеты, планеты, скафандры, кислород и связки космических модов."

[categories.mobs]
