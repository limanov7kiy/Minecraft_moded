# Категории справочника и принадлежность модов. Ключ мода: имя .pw.toml без суффикса
# (pack/mods/<ключ>.pw.toml) либо для jar — имя файла до первой цифры версии
# (например, wizardry-restored-0.6.0.jar -> wizardry-restored).
# Новый мод без записи здесь build.py выведет в «без категории» и завершится с ошибкой.

[categories.arknights]
title = "Arknights"
desc = "Расы, умения, мебель, Источник, Эндфилд и всё, что связано с миром Arknights."
extra = ["[Мысленная буря](arknights/mind-storm.md) — отдельная статья (ведёт Поток 48)"]

[categories.magic]
title = "Магия"
desc = "Заклинания, ритуалы, мана, кровь и дополнения к магическим модам."

[categories.weapons]
title = "Оружие"
desc = "Огнестрельное и тяжёлое оружие, пушки, патроны, зачарования для оружия."

[categories.space]
title = "Космос и ракеты"
desc = "Ракеты, планеты, скафандры, кислород и связки космических модов."

[categories.mobs]
title = "Мобы и боссы"
desc = "Новые существа, боссы, паразиты. Подробные таблицы боссов — docs/bosses.md."

[categories.dimensions]
title = "Измерения, данжи и структуры"
desc = "Aether, Twilight Forest, Blue Skies, Undergarden, пещеры, заброшенные города и аддоны к ним."

[categories.tech]
title = "Техника и автоматизация"
desc = "Create, Mekanism, AE2, Refined Storage, корабли Valkyrien Skies."

[categories.food]
title = "Еда и фермерство"
desc = "Farmer's Delight и его связки с остальными модами."

[categories.world]
title = "Мир: выживание, погода и катастрофы"
desc = "Температура и жажда, сезоны, штормы, торнадо, метеориты и обереги от них."

[categories.qol]
title = "Удобство, хранилища и строительство"
desc = "Рюкзаки, вейстоуны, гробницы, сундуки, WorldEdit, декор и мелкие улучшения."

[categories.optimization-ui]
title = "Оптимизация, интерфейс и ресурспаки"
desc = "Моды производительности, JEI и его дополнения, карты, подсказки, русификация."

[categories.voice]
title = "Звук и голосовой чат"
desc = "Simple Voice Chat, рации, физика звука."

[categories.ysm]
title = "Модели и косметика (YSM)"
desc = "Yes Steve Model — свои модели игроков. Подробности — docs/ysm-models.md."

[categories.libraries]
title = "Библиотеки и инструменты"
desc = "Модули, нужные другим модам, а также KubeJS и Almost Unified."

[categories.own]
title = "Свои моды и патчи"
desc = "Моды и порты, собранные в этом репозитории (mods-src/, patches/)."
extra = ["[Оберег от катаклизмов](own/disaster-ward.md) — подробный разбор нашего мода disaster-ward"]

