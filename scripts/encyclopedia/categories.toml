# Категории справочника и принадлежность модов. Ключ мода: имя .pw.toml без суффикса
# (pack/mods/<ключ>.pw.toml) либо для jar — имя файла до первой цифры версии
# (например, wizardry-restored-0.6.0.jar -> wizardry-restored).
# Новый мод без записи здесь build.py выведет в «без категории» и завершится с ошибкой.

[categories.arknights]
title = "Arknights"
desc = "Расы, умения, мебель, Источник, Эндфилд и всё, что связано с миром Arknights."
