[descriptions]
# Русские описания модов страниц «Arknights» и «Свои моды и патчи» (этап 2а справочника).
arknights-furs = "Клиентский мод: подменяет модель игрока в зависимости от расы Arknights (уши, хвосты, крылья)."
arknights-origins-originium-arts = "Слой Origins «Искусства Ориджиниума»: девять школ на выбор (огонь, лёд, молния, природа, свет, пространство, призыв, кровь, новичок)."
arknights-races = "Около 50 рас и подрас Terra для Origins со своими бонусами и навыками (Сарказ, Феллайн, Урсус, Эгир и др.)."
arknights-skills = "Восемь классов и 25 подклассов Arknights для Origins; к каждому классу — дерево навыков Pufferfish's Skills."
arknightsfurniture = "Строительный набор: мебель, обои, полы и логотипы фракций Arknights (113 блоков)."
bobs-originium-dream = "Мод Боба: ориджиниумные черви, бури и рост ориджиниума, биомы и структуры пустоши, десятки боссов, внутреннее измерение."
caerula-arbor = "Порождения моря и расползающаяся метка пучины: сложная кампания с рассудком, эволюцией, 46 структурами и около 15 боссами."
contigency-contract-lite = "Добровольные «контракты»: выбираете усложнения мобов и игрока, за прохождение получаете медали."
endfield-industry = "Фабрика по мотивам Arknights: Endfield: электробуры на жилах, ленты, опоры, цепочки машин и хранилище."
torchesbecomesunlight = "Сюжетное приключение с диалогами и напарниками: Урсус, Родос Айленд, Святой город, мега-структуры и боссы."
originiumarts = "Технологическая система Искусств Ориджиниума: руда и кристаллы, компилятор ядер, терминал травления и модули."
origins-forge = "Основа для рас: происхождения, слои выбора и силы (Forge-порт Origins)."
skills = "Деревья навыков Pufferfish: категории, очки, опыт и команды; сами деревья приносят другие моды."
skills-origins = "Совместимость Pufferfish's Skills и Origins: сила «разблокировать категорию» и награда «выдать силу Origins»."
sarkazs_furnace_side_fables = "Сюжет «печи» сарказов: мысли и их нагрузка, эпохи, Амия и измерение «Вечный покой», оружие и броня «Финал» и «Учжоу»."
wizardry-restored = "Дополнение к Electroblob's Wizardry Redux: 61 недостающее заклинание оригинала 1.12.2, сущности, статуи и 18 артефактов."
wizardry-golems = "Порт Wizardry Golems (WinDanesz): заклинания Golemancy, 31 тип голема, 36 артефактов и Living Snow."
necromancers-delight = "Порт Wizardry — Necromancer's Delight (WinDanesz): 15 заклинаний некромантии и 12 артефактов."
fishs-undead-rising-port = "Частичный порт Fish's Undead Rising: мобы, предметы и эффекты, нужные Necromancer's Delight."
galacticraft-revival = "Перенос геймплея Galacticraft на Ad Astra: лунный данж с боссом, ключи и схемы."
mm-compat = "Кодовые связки и исправления сборки: кислород скафандров, баги чужих модов, утечки памяти, JEI-категории."
mm-perf = "Клиентские удобства: режим слабого ПК, отвязка клавиш модов, предупреждения о памяти, ускорение JEI."
mm-autoupdate = "Серверное автообновление сборки с GitHub на старте сервера (или при остановке): выключено по умолчанию, источник — тег, копия и откат при ошибке."
ru-lang = "Клиентский мод: всегда включает русский ресурспак сборки и переводит захардкоженные строки модов."
voicechat-addons-forge = "Forge-порт трёх аддонов Simple Voice Chat от Max Henkel: AudioPlayer, Enhanced Groups, Voice Chat Interaction."
zombiehaveears = "Зомби слышат голос игроков в Simple Voice Chat; наша пересборка с исправленным mods.toml для Forge 47."
alshanex_familiars = "Волшебные питомцы-фамильяры для игроков с Iron's Spells 'n Spellbooks; порт под версию сборки."
cbc_nukes = "Ядерные боеприпасы для Create Big Cannons; порт под CBC 5.11."
mnaw = "Аддон к Mana and Artifice: ведьмовство, куклы и ритуалы симпатической магии; порт под M&A 3.1.11."
traveloptics = "Большое дополнение к Cataclysm и Iron's Spells: оружие, броня, боссы и 176 заклинаний; порт под версии сборки."
eso-forge = "Enchanting System Overhaul: стол зачарования без рандома — чары сначала изучают из найденных книг, потом накладывают за материалы; порт под моды брони сборки."
origin_visuals = "Клиентский порт Origin Furs: модели игрока для рас Origins (со встроенной копией AzureLib 2)."
gaboulibs-shim = "Замена удалённой автором библиотеки GabouLibs для Serene Seasons Plus (patches/gaboulibs-shim)."
lycanites-refmap-fix = "Недостающий refmap миксинов Lycanites Mobs — без пересборки 120-МБ jar (patches/lycanites-refmap)."
vampirism = "Вампиры и охотники: стать вампиром (кровь, страх солнца, умения) или охотником, захваты деревень, склепы, аванпосты, Вампирский лес."
arknights_weapon = "Оружие Arknights (порт оригинала с CurseForge): убран RiseProcedure, удваивавший здоровье мобов при каждой загрузке чанка."
bstweaks = "Blue Skies Tweaks: твики Blue Skies (описание в mods.toml пустое)."
deeper_and_darker_to_cataclysm = "Связка прогрессии Deeper and Darker с L_Ender's Cataclysm (описание в mods.toml пустое)."
ad-astra = "Космическое расширение: планеты как отдельные измерения (Луна, Марс, Венера, Меркурий, Глацио) со своим воздухом, температурой и гравитацией, скафандры, кислородные машины, ровер и реактивный костюм. В сборке отвечает за планеты и орбиты единой Солнечной системы; его крафтовые ракеты убраны."
ad-astra-giselle-addon = "Дополнение к Ad Astra: кислородные канистры, топливный погрузчик, датчик ракеты и четыре чары защиты в мирах Ad Astra (дыхание, огонь, кислотный дождь, гравитация), а также модули МекаСкафандра."
northstar-redux = "Космос для Create в духе Galacticraft: ракеты собираются из блоков, нужны двигатели, топливо, навигатор и теплозащита; планеты открываются телескопом, есть электролиз, герметизаторы и скафандры. В сборке даёт ракеты и гравитацию, а сами планеты — Ad Astra."
create-northstar-structures = "Лунные кратеры всех размеров и гигантский бассейн Южный полюс — Эйткен для Northstar, плюс Лунный компас и команда поиска. В сборке работает и на Луне Ad Astra (патч), с исправлением удаления мобов."
creating-space = "Ракеты на Create с настоящей инженерией: двигатель проектируется по чертежу, топливные пары и дельта-V ограничивают маршрут. Даёт двигатели, ракеты и скафандры; в сборке маршруты ведут по планетам Ad Astra."
mekanism-x-create-northstar = "Мост между Mekanism и Northstar: модули МекаСкафандра (космический костюм, кислородный баллон, утепление, защита от жары) и материалы к ним (изоляция, дюрасталь)."
the-lost-cities = "Генерирует заброшенные города (улицы, шоссе, здания с подвалами, метро, спавнерами и сундуками) прямо в обычном Overworld; в сборке включён редкий профиль rarecities (≈6 % городских чанков), действует для нового мира."
l_enders-cataclysm = "Cataclysm от L_Ender: восемь крупных структур-арен с боссами (Игнис, Левиафан, Сцилла, Предвестник и др.), мини-боссы и мобы Незера, пустыни, океана и Края, оружие и броня по ступеням (чёрная сталь, игнит, проклятый слиток) и аметистовые пещеры."
alexs-mobs = "Больше 90 оригинальных животных и монстров с повадками, приручением и крафтом из дропа; всё описано во внутриигровой Книге о животных (Animal Dictionary), есть босс Червь Пустоты."
lycanites-mobs = "Свыше 120 существ с тематическими данжами, мобовыми событиями и боссами (Раховарт, Асмодей, Амальгалич); приручение, камни души, призыв миньонов и Зверинец."
irons-spells-n-spellbooks = "Магия в духе классических RPG: заклинания хранятся в свитках и книгах, колдуются за ману в школах (огонь, лёд, молния, свет, эндер, кровь, призыв, природа, потусторонье); добавляет посохи, броню магов, станции начертания и улучшения, магические структуры с боссами (Мёртвый король, Эхо Тироса)."
mana-and-artifice = "Магия плетения маны от Mithion: заклинания и ритуалы создаются из частей и рисунков-узоров, прогресс ведёт Оккулус и Кодекс мага; игрок выбирает фракцию (Совет, демоны, феи, нежить) и может вызвать боссов вроде Одина или Повелителя демонов."
electroblobs-wizardry-redux = "Возрождение классического Electroblob's Wizardry для 1.20.1: семь стихий и четыре ступени заклинаний, посохи, кристаллы, броня и артефакты, Таинственный верстак и Алтарь наполнения, башни магов, святилища и обелиски; в сборке дополнен модом Wizardry Restored."
cataclysm_spellbooks = "Мод-связка Cataclysm и Iron's Spells: заклинания, книги, посохи, оружие и броня по мотивам боссов Cataclysm, две новые школы магии (Бездна и Техномантия); в сборке — наш порт под Cataclysm 3.31."
capsidfix = "Заплатка к Alex's Mobs: чинит дублирование предметов через блок Капсид (выпадает с Эндериофага). Своего контента не добавляет."
scp_ultimate = "Фонд SCP: около 100 SCP-объектов (173, 096, 106, 682, 939…), охраняемые базы SCP Site и заброшенные комплексы со сбежавшими SCP в обычном мире, 5 измерений, создание SCP из ядер в сборщике SCP, руда телекилла. Мобы ломают блоки, как в оригинале."
scp-foundation-requisites = "Всё для своей зоны содержания SCP: ~2 000 блоков (двери, гермодвери, считыватели ключ-карт, кнопки, декор из SCP: CB/SL), админ-панель и 25 видов подземных комнат и коридоров в мире. Огнестрел мода скрыт — оружие в сборке из TACZ."
chaospersists = "Ремейк OreSpawn 1.7.10 на 1.20.1: около 130 мобов и боссов (Король, Королева, Мобзилла, Кракен, Кошмар), шесть измерений, 54 структуры, руды, оружие и броня «Хаоса», питомцы и еда."
fungal-infectionspore = "Зомби-апокалипсис поверх ванили: мицелий превращает мобов в заражённых, они эволюционируют, растут Курганы и Протомозг, а на высшей стадии приходят калимити-боссы. Есть оружие и броня из органов, Сканер и станции."
