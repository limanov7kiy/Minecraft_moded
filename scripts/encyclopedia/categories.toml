desc = "Yes Steve Model — свои модели игроков. Подробности — docs/ysm-models.md."

[categories.libraries]
title = "Библиотеки и инструменты"
desc = "Модули, нужные другим модам, а также KubeJS и Almost Unified."

[categories.own]
