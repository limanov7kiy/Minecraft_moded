# Профиль The Lost Cities для НОВОГО мира (Forge копирует defaultconfigs/ в serverconfig/ мира при создании).
# На уже созданном мире не действует. Подробности и профили — docs/lost-cities.md.
[profiles]
	selectedProfile = "rarecities"
	selectedCustomJson = ""
	# Города не строятся в чанках, через которые проходит структура из списка (Lost Cities смотрит ссылки структур
	# в каждом чанке — вся площадь постройки, не только чанк старта). Первые 6 — значения Lost Cities по умолчанию;
	# дальше базы и заброшенные комплексы SCP: Ultimate и наземные комнаты SCP: Foundation Requisites (подземные — ниже Y 0, городам не мешают; поток 73, docs/compat.md «SCP»).
	# Затем все постройки Vampirism (поток 75, docs/vampirism.md).
	avoidStructures = ["minecraft:mansion", "minecraft:jungle_pyramid", "minecraft:desert_pyramid", "minecraft:igloo", "minecraft:swamp_huts", "minecraft:pillager_outpost", "scp_ultimate:scp_site_1", "scp_ultimate:scp_site_2", "scp_ultimate:scp_site_3", "scp_ultimate:facility_natural_1", "scp_ultimate:facility_natural_2", "scp_ultimate:facility_natural_3", "scpfr:hcz_armory", "scpfr:med_bay", "scpfr:scp_294_chamber", "scpfr:scp_330_chamber", "scpfr:storage_room", "vampirism:crypt", "vampirism:vampire_hut", "vampirism:vampire_altar", "vampirism:mother", "vampirism:hunter_camp", "vampirism:hunter_outpost_plains", "vampirism:hunter_outpost_desert", "vampirism:hunter_outpost_badlands", "vampirism:hunter_outpost_vampire_forest"]
