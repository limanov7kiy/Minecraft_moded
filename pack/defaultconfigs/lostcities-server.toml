# Профиль The Lost Cities для НОВОГО мира (Forge копирует defaultconfigs/ в serverconfig/ мира при создании).
# На уже созданном мире не действует. Подробности и профили — docs/lost-cities.md.
[profiles]
	selectedProfile = "rarecities"
	selectedCustomJson = ""
	# Поток 34 (OOM при полёте над новыми чанками): кэш BuildingInfo/планов чанков держится N секунд после последнего обращения.
	# По умолчанию 300 — при быстром полёте за 5 минут копится несколько сотен тысяч записей (гигабайты кучи). 60 хватает
	# на генерацию области вокруг игрока; дальше данные пересчитываются при необходимости. Замер — docs/compat.md.
	cacheCleanupSeconds = 60
