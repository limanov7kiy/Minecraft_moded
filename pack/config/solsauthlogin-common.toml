
#Sol's AuthLogin System Configuration
[general]

	#Timeout Settings
	[general.timeout]
		#Seconds before player is kicked for not logging in (0 = disabled)
		#Range: 0 ~ 600
		loginTimeoutSeconds = 180
		#Seconds to wait before teleporting player back after successful login
		#Range: 1 ~ 60
		gracePeriodSeconds = 5
		#Minutes to keep session cached for auto-login if same IP reconnects (0 = disabled)
		#Range: 0 ~ 1440
		sessionCacheMinutes = 30

	#Security Settings
	[general.security]
		#Maximum failed login attempts before temporary lockout
		#Range: 1 ~ 20
		maxLoginAttempts = 5
		#Seconds to lock player out after max failed attempts
		#Range: 30 ~ 3600
		lockoutTimeSeconds = 300
		#Minimum password length
		#Range: 4 ~ 32
		minPasswordLength = 6
		#Maximum password length
		#Range: 8 ~ 128
		maxPasswordLength = 32
		#Require at least one special character in password
		requireSpecialChar = false
		#Require at least one number in password
		requireNumber = false
		#Enable automatic re-login if player reconnects from same IP within session timeout
		enableSessionCache = true
		#Kick player after too many failed login attempts
		kickOnLockout = true
		#Prevent multiple players from logging into the same account simultaneously
		preventMultipleLogins = true
		#Require players to have Sol's AuthLogin mod installed on client (recommended for token auto-login)
		requireClientMod = false
		#Require the local owner to authenticate in integrated single-player worlds
		enableInSingleplayer = false

	#Spawn and Teleport Settings
	[general.spawn]
		#Move unauthenticated players to the auth staging spawn while spectator-locked
		teleportToSpawn = true
		#Return players to their saved pre-auth position after login (requires teleportToSpawn)
		teleportBackAfterLogin = true
		#When teleportToSpawn is true, use world spawn for auth staging
		useWorldSpawn = true
		#Auth staging X coordinate when teleportToSpawn=true and useWorldSpawn=false
		#Range: -30000000 ~ 30000000
		customSpawnX = 0
		#Auth staging Y coordinate when teleportToSpawn=true and useWorldSpawn=false
		#Range: -64 ~ 320
		customSpawnY = 100
		#Auth staging Z coordinate when teleportToSpawn=true and useWorldSpawn=false
		#Range: -30000000 ~ 30000000
		customSpawnZ = 0

	#Notification Settings
	[general.notifications]
		#Seconds between login reminder messages
		#Range: 5 ~ 60
		reminderIntervalSeconds = 10
		#Show title screen reminders
		showTitleReminders = true
		#Show action bar reminders
		showActionBarReminders = true

	#Message Settings
	[general.messages]
		#Core Player Prompts
		#Message shown to new players who need to register
		registerPromptMessage = "§6Welcome! Please register with §e/register <password> <password>"
		#Message shown to returning players who need to login
		loginPromptMessage = "§6Welcome back! Please login with §e/login <password>"
		#Message shown on successful login
		loginSuccessMessage = "§aLogin successful! Teleporting in %d seconds..."
		#Message shown on successful registration
		registerSuccessMessage = "§aRegistration successful! You are now logged in. Teleporting in %d seconds..."
		#Message shown when unauthenticated player tries to do something
		actionBlockedMessage = "§cYou must login first! Use §e/login <password> §cor §e/register <password> <password>"
		#Kick message for login timeout
		timeoutKickMessage = "§cKicked: Login timeout exceeded. Please reconnect and login."
		#Kick message for too many wrong password attempts
		kickWrongPasswordMessage = "§cKicked: Too many failed login attempts. Please wait before reconnecting."
		#Join and Authentication Gate
		#Message shown when a username is already authenticated from another session
		duplicateLoginMessage = "§cAnother player is already logged in with this username!"
		#Kick message shown when client mod is required but missing
		requireClientModMessage = "§cThis server requires Sol's AuthLogin mod on your client."
