# ModernFix: опции, отличающиеся от умолчаний (поток 8 «Производительность», docs/performance.md).
# Файл целиком заменяет сгенерированный; удалите строку/файл, чтобы вернуть умолчание мода.

# Не готовить «спавн-чанки» (радиус 11 вокруг точки спавна, ~530 чанков) при создании/входе в мир:
# чанки грузятся только вокруг игрока. Главный ускоритель создания мира и входа в одиночную игру;
# заодно меньше памяти. Минус: механизмы у спавна больше не работают, пока рядом никого нет.
mixin.perf.remove_spawn_chunks=true

# Динамические ресурсы: модели блоков/предметов запекаются по требованию, а не все ~240 модов разом при старте.
# Резко сокращает время загрузки клиента и расход памяти в больших сборках.
mixin.perf.dynamic_resources=true

