# Canary (порт Lithium). Отключаем оптимизацию POI: её миксин перезаписывает PoiManager.getInRange
# и ломает миксин Valkyrien Skies (MixinPOIManager) — сервер падает при создании мира.
mixin.ai.poi=false

# Celestia: Canary alloc.deep_passengers конфликтует с CodeChickenLib-трансформером
# (PRIVATE @Overwrite Entity m_146920_) — сервер падал при старте. Оптимизация мелкая, отключаем.
mixin.alloc.deep_passengers=false

# CCL (CodeChicken Lib, идёт с Draconic Evolution) меняет видимость приватных методов Entity,
# которые Canary перезаписывает — сервер падал при старте с этой связкой (2026-11-22).
# Обе оптимизации мелкие, остальные Canary-оптимизации сохранены.
mixin.alloc.deep_passengers=false
mixin.ai.replace_streams=false
