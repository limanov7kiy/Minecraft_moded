	#infection效果基础持续时间
	#infection效果每级的持续时间
	#单位: 刻 (20刻=1秒)
	#默认: 6000 (5分钟)
	#Range: 20 ~ 72000
	infection_base_duration = 6000
	#感染转换血量阈值
	#当生物血量低于此百分比时触发感染转换
	#单位: 百分比 (0.0-1.0)
	#默认: 0.3 (30%)
	#Range: 0.01 ~ 1.0
	infection_transform_threshold = 0.3
	#默认感染转换生物
	#当感染映射表中没有对应映射时，将生物转换为此生物
	#格式: modid:entity_id
	#示例: "minecraft:zombie"
	default_infection_entity = "spore:inf_human"

#Boom效果配置
[boom_effect]
	#Boom效果触发概率
	#血量100以上的非玩家生物攻击时触发boom效果的概率
	#单位: 百分比 (0.0-1.0)
	#默认: 0.1 (10%)
	#Range: 0.0 ~ 1.0
	boom_effect_chance = 0.1
	#Boom爆炸强度
	#当boom效果达到7级时产生的爆炸强度
	#默认: 2
	#Range: 1 ~ 10
	boom_explosion_strength = 2

#限伤功能配置
[damage_limit]
	#启用限伤功能
	#如果为true，特定生物的单次伤害将被限制
	#默认: true
	enable = true
	#限伤生物列表
	#这些生物的单次伤害将被限制
	#格式: modid:entity_id
